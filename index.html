<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Splatoonランダムブキガチャ">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'">
  <title>Splatoonブキガチャ</title>
  <link rel="icon" type="image/png" href="assets/images/ui/shell-out-machine.png">
  <link rel="stylesheet" href="assets/css/style.css?v=62">
</head>
<body>
  <div class="ink-glow ink-glow--pink" aria-hidden="true"></div>
  <div class="ink-glow ink-glow--cyan" aria-hidden="true"></div>

  <button id="sidebar-collapse-button" class="sidebar-toggle-button" type="button" aria-expanded="true" aria-controls="app-sidebar" aria-label="サイドバーを閉じる">
    <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M9 5v14"></path></svg>
  </button>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="抽選操作と設定">
      <div class="sidebar-inner">
        <div class="sidebar-brand">
          <button id="sidebar-brand-icon-button" class="sidebar-brand-button" type="button" aria-label="カプセルを転がす">
            <img class="app-title__icon" src="assets/images/ui/gold-capsule.webp?v=4" alt="" aria-hidden="true" width="56" height="56" fetchpriority="high">
          </button>
        </div>

      <section class="sidebar-section" aria-labelledby="mode-title">
        <h2 id="mode-title" class="sidebar-heading">
          <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg>
          モード
        </h2>
        <div class="mode-tabs" role="radiogroup" aria-label="抽選モード">
          <button class="mode-tab is-active" type="button" role="radio" aria-checked="true" data-mode="private">
            <span class="mode-tab__copy"><strong>プライベートマッチ</strong><small>10人までみんなでランダム</small></span>
            <svg class="ui-icon mode-tab__check" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>
          </button>
          <button class="mode-tab" type="button" role="radio" aria-checked="false" data-mode="open" tabindex="-1">
            <span class="mode-tab__copy"><strong>オープンマッチ</strong><small>チーム全員でランダム</small></span>
            <svg class="ui-icon mode-tab__check" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>
          </button>
          <button class="mode-tab" type="button" role="radio" aria-checked="false" data-mode="unity" tabindex="-1">
            <span class="mode-tab__copy"><strong>ブキ統一</strong><small>チーム全員で同じブキ</small></span>
            <svg class="ui-icon mode-tab__check" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>
          </button>
        </div>
      </section>

      <section id="count-control" class="sidebar-section count-control" aria-labelledby="count-title">
        <h2 id="count-title" class="sidebar-heading">
          <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
          プレイヤー数
        </h2>
        <div class="count-stepper" data-direction="idle">
          <button id="count-down" type="button" aria-label="人数を1人減らす"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg></button>
          <div class="count-value">
            <output id="count-output" for="player-count" aria-live="polite" aria-atomic="true">4</output>
          </div>
          <input id="player-count" type="range" min="2" max="10" value="4" aria-label="抽選する人数">
          <button id="count-up" type="button" aria-label="人数を1人増やす"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
        </div>
      </section>

      <section class="sidebar-section sidebar-status" aria-labelledby="status-title">
        <h2 id="status-title" class="sidebar-heading">
          <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="m7 16 4-4 3 3 5-6"></path></svg>
          ステータス
        </h2>
        <div class="status-card" aria-live="polite">
          <div class="status-row">
            <span class="status-row__label"><i class="status-dot" aria-hidden="true"></i>抽選対象</span>
            <strong><span id="active-count">0</span><small> / <span id="total-count">0</span></small></strong>
          </div>
          <div class="status-row">
            <span class="status-row__label"><i class="status-dot status-dot--excluded" aria-hidden="true"></i>除外中</span>
            <strong><span id="excluded-count">0</span></strong>
          </div>
        </div>
      </section>

      <section class="sidebar-section sidebar-settings" aria-labelledby="settings-title">
        <h2 id="settings-title" class="sidebar-heading">
          <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.37.35.7.64.96.3.26.68.4 1.08.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"></path></svg>
          設定
        </h2>
        <label class="setting-toggle" for="draw-animation-toggle">
          <span class="setting-toggle__copy">
            <strong>ガチャアニメーション</strong>
            <small>抽選中の演出を表示</small>
          </span>
          <input id="draw-animation-toggle" type="checkbox" checked>
          <span class="setting-toggle__switch" aria-hidden="true"></span>
        </label>
      </section>

      <section class="sidebar-section sidebar-tools" aria-label="データ管理">
        <div id="data-menu" class="data-menu" hidden>
          <p class="data-menu__title">データ管理</p>
          <input id="import-input" type="file" accept="application/json,.json" hidden>
          <button id="import-button" class="data-menu__item" type="button">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 21h14a2 2 0 0 0 2-2v-4"></path><path d="M3 15v4a2 2 0 0 0 2 2"></path></svg>
            JSONを読み込む
          </button>
          <button id="export-button" class="data-menu__item" type="button">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15V3"></path><path d="m17 10-5 5-5-5"></path><path d="M5 21h14a2 2 0 0 0 2-2v-4"></path><path d="M3 15v4a2 2 0 0 0 2 2"></path></svg>
            JSONを書き出す
          </button>
          <button id="reset-exclusions-button" class="data-menu__item" type="button">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
            除外をリセット
          </button>
          <button id="reset-data-button" class="data-menu__item data-menu__item--danger" type="button">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>
            初期データに戻す
          </button>
        </div>
        <button id="data-menu-button" class="sidebar-menu-button" type="button" aria-expanded="false" aria-controls="data-menu">
          <span class="sidebar-menu-button__label">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14a9 3 0 0 0 18 0V5"></path><path d="M3 12a9 3 0 0 0 18 0"></path></svg>
            データ管理
          </span>
          <svg class="ui-icon sidebar-menu-button__arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </section>

      </div>
    </aside>

    <main>
      <header class="content-header">
        <div>
          <p class="content-kicker">Splatoon / RANDOM WEAPON</p>
          <div class="content-title">
            <h1>ブキガチャ</h1>
            <img class="content-title__icon" src="assets/images/ui/shell-out-machine.webp?v=4" alt="" aria-hidden="true" width="56" height="56">
          </div>
          <p class="content-lead">プレイヤーごとにランダムでブキを決めます</p>
        </div>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

      <section class="results-section" aria-labelledby="results-title">
        <div class="section-heading">
          <h2 id="results-title">ガチャ結果</h2>
          <div class="section-heading__actions">
            <button id="exclude-results-button" class="action-link" type="button" hidden disabled>表示中のブキを抽選から外す</button>
            <button id="draw-button" class="draw-button" type="button">
              <strong>ガチャを回す</strong>
              <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"></rect><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"></path><path d="M6 18h.01"></path><path d="M10 14h.01"></path><path d="M15 6h.01"></path><path d="M18 9h.01"></path></svg>
            </button>
          </div>
        </div>
        <div id="results-grid" class="results-grid"></div>
      </section>

      <section id="items-section" class="items-section" aria-labelledby="items-title">
        <div class="section-heading">
          <div>
            <h2 id="items-title">ブキリスト</h2>
            <p class="section-description">ブキをクリックして抽選対象／除外を切り替え</p>
          </div>
          <div class="items-section__controls">
            <div class="list-actions">
              <button id="exclude-all-button" class="action-link action-link--danger" type="button">このモードのブキをすべて除外</button>
              <button id="clear-exclusions-button" class="action-link action-link--safe" type="button">このモードの除外をすべて解除</button>
            </div>
            <button id="items-toggle-button" class="items-toggle-button" type="button" aria-expanded="false" aria-label="全カテゴリを開く">
              <svg class="ui-icon items-toggle-button__arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
          </div>
        </div>
        <div id="items-content" class="items-section__content" aria-hidden="false">
          <div id="category-list" class="category-list"></div>
        </div>
      </section>

      <footer><p>データは端末内だけに保存されます。</p></footer>
    </main>
  </div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-description">
    <form method="dialog">
      <h2 id="confirm-dialog-title">初期データに戻しますか？</h2>
      <p id="confirm-dialog-description">現在の項目と、すべてのモードの除外状態が消去されます。</p>
      <div class="dialog-actions">
        <button value="cancel" class="utility-button">キャンセル</button>
        <button value="confirm" class="dialog-confirm">初期データに戻す</button>
      </div>
    </form>
  </dialog>

  <dialog id="exclude-all-dialog" aria-labelledby="exclude-all-dialog-title" aria-describedby="exclude-all-dialog-description">
    <form method="dialog">
      <h2 id="exclude-all-dialog-title">ブキをすべて除外しますか？</h2>
      <p id="exclude-all-dialog-description">このモードのブキがすべて抽選対象から外れます。あとで解除できます。</p>
      <div class="dialog-actions">
        <button value="cancel" class="utility-button">キャンセル</button>
        <button value="confirm" class="dialog-confirm">すべて除外する</button>
      </div>
    </form>
  </dialog>

  <script src="assets/js/weapon-icons.js?v=3" defer></script>
  <script src="assets/js/app.js?v=24" defer></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="抽選対象を管理できるSplatoonランダムブキルーレット">
  <title>Splatoonブキルーレット</title>
  <link rel="icon" type="image/png" href="_images/MainWeapons/Splattershot.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ink-glow ink-glow--pink" aria-hidden="true"></div>
  <div class="ink-glow ink-glow--cyan" aria-hidden="true"></div>

  <header class="site-header">
    <p class="app-title">Splatoonブキルーレット</p>
    <div class="theme-preview" aria-label="配色プレビュー">
      <span>配色</span>
      <button class="theme-preview__button is-active" type="button" data-theme="ink" aria-pressed="true"><i></i>Ink</button>
      <button class="theme-preview__button" type="button" data-theme="night" aria-pressed="false"><i></i>Night</button>
      <button class="theme-preview__button" type="button" data-theme="forest" aria-pressed="false"><i></i>Forest</button>
      <button class="theme-preview__button" type="button" data-theme="blush" aria-pressed="false"><i></i>Blush</button>
      <button class="theme-preview__button" type="button" data-theme="cream" aria-pressed="false"><i></i>Cream</button>
      <button class="theme-preview__button" type="button" data-theme="sky" aria-pressed="false"><i></i>Sky</button>
    </div>
    <div class="data-actions" aria-label="データ管理">
      <input id="import-input" type="file" accept="application/json,.json" hidden>
      <button id="import-button" class="utility-button" type="button">JSONを読み込む</button>
      <button id="export-button" class="utility-button" type="button">JSONを書き出す</button>
      <button id="reset-data-button" class="utility-button utility-button--danger" type="button">初期データに戻す</button>
    </div>
  </header>

  <main>
    <section class="control-deck" aria-label="抽選操作">
      <div class="draw-console">
        <div class="mode-tabs" role="tablist" aria-label="抽選モード">
          <button class="mode-tab is-active" type="button" role="tab" aria-selected="true" data-mode="multi">
            プライベートマッチ
          </button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="four">
            オープンマッチ
          </button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="single">
            ブキ統一
          </button>
        </div>

        <div class="draw-console__body">
          <div id="count-control" class="count-control">
            <label for="player-count">プレイヤー数</label>
            <div class="count-stepper">
              <button id="count-down" type="button" aria-label="人数を1人減らす">−</button>
              <output id="count-output" for="player-count">4</output>
              <input id="player-count" type="range" min="1" max="10" value="4" aria-label="抽選する人数">
              <button id="count-up" type="button" aria-label="人数を1人増やす">＋</button>
            </div>
          </div>

          <button id="draw-button" class="draw-button" type="button">
            <strong>抽選する</strong>
          </button>

          <div class="pool-meter" aria-live="polite">
            <span>ブキ数</span>
            <strong><span id="active-count">0</span><small> / <span id="total-count">0</span></small></strong>
          </div>
        </div>
      </div>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <section class="results-section" aria-labelledby="results-title">
      <div class="section-heading">
        <div>
          <h2 id="results-title">ブキルーレット結果</h2>
        </div>
        <button id="exclude-results-button" class="action-link" type="button" hidden disabled>表示中のブキを抽選から外す</button>
      </div>
      <div id="results-grid" class="results-grid"></div>
    </section>

    <section class="items-section" aria-labelledby="items-title">
      <div class="section-heading">
        <div>
          <h2 id="items-title">ブキリスト</h2>
        </div>
        <div class="list-actions">
          <p>クリックで抽選対象／除外を切り替え</p>
          <button id="exclude-all-button" class="action-link" type="button">このモードのブキをすべて除外</button>
          <button id="clear-exclusions-button" class="action-link" type="button">このモードの除外をすべて解除</button>
        </div>
      </div>
      <div id="category-list" class="category-list" aria-live="polite"></div>
    </section>
  </main>

  <footer><p>データは端末内だけに保存されます。</p></footer>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2>初期データに戻しますか？</h2>
      <p>現在の項目と、すべてのモードの除外状態が消去されます。</p>
      <div class="dialog-actions">
        <button value="cancel" class="utility-button">キャンセル</button>
        <button value="confirm" class="dialog-confirm">初期データに戻す</button>
      </div>
    </form>
  </dialog>

  <script src="weapon-icons.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
